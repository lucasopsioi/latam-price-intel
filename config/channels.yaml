# ============================================================
# 国家 / 渠道 配置
#
# search_url 里的 {q} 会被替换成搜索词（已 URL 编码）。
# adapter: app/scraping/channels/ 下的适配器名；generic = 通用三级抽取
#          （JSON-LD → 站点选择器 → LLM 文本兜底）
# default_seller_type:
#   official    自营/官方（零售商自营、品牌官网、运营商）→ 价格可直接进分析
#   third_party 第三方卖家为主（marketplace）→ 必须过价格审计 Agent
#
# ★ URL 会随站点改版失效。跑 `python main.py doctor` 做体检（可加
#   --country MX / --channel liverpool / --limit 3 缩小范围），
#   失效的会明确报出来，不会静默变成"这个渠道今天没数据"。
# ============================================================

countries:
  MX:
    name_zh: 墨西哥
    name_local: México
    currency: MXN
    lang: es
    locale: es-MX
    timezone: America/Mexico_City
    meli_site: MLM
    meli_domain: mercadolibre.com.mx
    sort_order: 1
  BR:
    name_zh: 巴西
    name_local: Brasil
    currency: BRL
    lang: pt
    locale: pt-BR
    timezone: America/Sao_Paulo
    meli_site: MLB
    meli_domain: mercadolivre.com.br
    sort_order: 2
    # ★ 用户 2026-08-11 明确：BR/AR 不做竞品对照。
    #   原因：Acme在这两国**没有自营商城**（/br/offer/、/ar/offer/ 都不存在），
    #   拿不到官方定价 ⇒ 算不出「Acme vs 友商」的价差。
    #   ★ 这是**口径决定**，不是数据缺口 —— 两者必须分开：
    #     BR/AR 无我方价 = 按口径就该没有，不要报警、不要当待办；
    #     MX/CO/CL/PE 无我方价 = 真出问题了（商城没抓到），必须报警。
    #   友商价照常抓：竞争动态看板、价格变动、周报、VOC 对这两国全部照常工作。
    own_pricing: false
  CO:
    name_zh: 哥伦比亚
    name_local: Colombia
    currency: COP
    lang: es
    locale: es-CO
    timezone: America/Bogota
    meli_site: MCO
    meli_domain: mercadolibre.com.co
    sort_order: 3
  CL:
    name_zh: 智利
    name_local: Chile
    currency: CLP
    lang: es
    locale: es-CL
    timezone: America/Santiago
    meli_site: MLC
    meli_domain: mercadolibre.cl
    sort_order: 4
  PE:
    name_zh: 秘鲁
    name_local: Perú
    currency: PEN
    lang: es
    locale: es-PE
    timezone: America/Lima
    meli_site: MPE
    meli_domain: mercadolibre.com.pe
    sort_order: 5
  AR:
    name_zh: 阿根廷
    name_local: Argentina
    currency: ARS
    lang: es
    locale: es-AR
    timezone: America/Argentina/Buenos_Aires
    meli_site: MLA
    meli_domain: mercadolibre.com.ar
    sort_order: 6
    # ★ 用户 2026-08-11 明确：BR/AR 不做竞品对照。
    #   原因：Acme在这两国**没有自营商城**（/br/offer/、/ar/offer/ 都不存在），
    #   拿不到官方定价 ⇒ 算不出「Acme vs 友商」的价差。
    #   ★ 这是**口径决定**，不是数据缺口 —— 两者必须分开：
    #     BR/AR 无我方价 = 按口径就该没有，不要报警、不要当待办；
    #     MX/CO/CL/PE 无我方价 = 真出问题了（商城没抓到），必须报警。
    #   友商价照常抓：竞争动态看板、价格变动、周报、VOC 对这两国全部照常工作。
    own_pricing: false

channels:

  # ---------------- 墨西哥 ----------------
  - code: liverpool
    country: MX
    name: Liverpool
    kind: retailer
    base_url: "https://www.liverpool.com.mx"
    search_url: "https://www.liverpool.com.mx/tienda?s={q}"
    adapter: liverpool
    default_seller_type: official
    priority: 10
    # 2026-08-10 实测：Playwright 冷却换设备重试两次仍被人机验证拦死；
    # Selenium(undetected) 一次通过，解析出 56 条真实商品。
    # （这是把 Selenium 定为主引擎的直接依据，见 app/config.py）
  - code: coppel
    country: MX
    name: Coppel
    kind: retailer
    base_url: "https://www.coppel.com"
    # ★ Coppel 没有可用的站内搜索：/search、/s、/busqueda、/?q= 全部
    #   返回 "Página no encontrada"（404）或首页推荐位（床垫、工作靴）。
    #   真实结构是品类页 /ct/<slug>/<catId>，实测手机品类：
    #   手机词 59、杂项 2、价格串 90 → 可用。
    #   所以走 category_page 模式（与 Samsung 官网同一机制）。
    search_url: "https://www.coppel.com/ct/celulares/cat000001"
    category_urls:
      phone: "https://www.coppel.com/ct/celulares/cat000001"
    adapter: coppel
    default_seller_type: official
    priority: 20
    notes: "2026-08-10 实测：站内搜索路径全部 404 或返回推荐位，改用品类页。
      其余品类的 catId 待补（在首页导航里能找到 /ct/<slug>/<catId> 形式）。"
  - code: sears
    country: MX
    name: Sears México
    kind: retailer
    base_url: "https://www.sears.com.mx"
    # ★ 2026-08-10 两步定位到根因，两处都错：路径错 + 参数名错。
    #   /busca/?q=…          → 13KB 空壳，0 价格（看起来像"该渠道没货"）
    #   /resultados/?q=…     → 前端 JS 报 "Application error"，并自己追加
    #                          `query=undefined` —— 这是在说参数名不对
    #   /resultados?query=…  → ★手机词 204、价格串 192  ← 正确
    search_url: "https://www.sears.com.mx/resultados?query={q}"
    adapter: sears
    default_seller_type: official
    priority: 30
    notes: "2026-08-10 实测：返回 HTML 仅 31KB、0 价格 0 JSON-LD，是 SPA 空壳。
      与 Sanborns 同属 Grupo Sanborns，站点结构相同，共用适配器。"
  - code: sanborns
    country: MX
    name: Sanborns
    kind: retailer
    base_url: "https://www.sanborns.com.mx"
    # 与 Sears 同属 Grupo Sanborns，站点结构相同，参数名同为 query
    # 实测（2026-08-10）：手机词 166、价格串 197
    search_url: "https://www.sanborns.com.mx/resultados?query={q}"
    adapter: sanborns
    default_seller_type: official
    priority: 40
    notes: "2026-08-10 实测：Playwright 被人机验证拦死；Selenium 能打开但返回 33KB
      空壳（0 条）。URL 形态待确认。"
  - code: amazon
    country: MX
    name: Amazon México
    kind: marketplace
    base_url: "https://www.amazon.com.mx"
    search_url: "https://www.amazon.com.mx/s?k={q}"
    adapter: amazon
    # ★★ 2026-08-12 停用：amazon.com.br / amazon.com.mx 的 robots.txt
    #   **点名**禁止本 agent 全站访问：
    #       User-agent: ClaudeBot    → Disallow: /
    #       User-agent: Claude-Web   → Disallow: /
    #       User-agent: Claude-User  → Disallow: /
    #   站方对我们这类 agent 明确说了不。继续抓就得把自己伪装成别的东西 ——
    #   那是欺骗，本项目不做（与 versus.com 同一条线）。
    #   要恢复只有两条正路：申请 Amazon 官方 Product Advertising API，
    #   或由用户本人以自己的身份取数。**不要靠改 User-Agent 绕过**。
    #   复查方式：python tools/check_robots.py（robots 会变，建议每月一次）
    enabled: 0
    default_seller_type: unknown
    priority: 15
  # ★★ Acme自家官方商城 —— 我方的官方定价基准。
  #   用户 2026-08-11 明确指出：「商城的价格就是官方定价」，
  #   所以不再要求手工录入 my_pricing，直接抓。
  #   实测（2026-08-11）：/{cc}/phones/ 是产品介绍页**不带价**，
  #   /{cc}/offer/ 才是商城（MX 826 个价格串 / CO 208 / PE 153 / CL 81）。
  #   BR 与 AR 没有 offer 页（Acme在这两国无自营商城），只能从零售渠道取价。
  #
  # ★ adapter: acme_store —— 必须用专用适配器，不能用 generic。
  #   通用解析器在这四个站上抓到的是**分期月供**：智利 Astra X7 记成
  #   183,333 CLP（×12 期才是 2,199,990 的真实价），秘鲁墨西哥同样中招。
  #   专用适配器改读页面内嵌 JSON，那里 installmentAmount 与总价是分开的字段。
  #
  # ★ 下面四个 category_urls **指向同一个页面**（一页混着手机/平板/手表/耳机）。
  #   所以每国只需跑**一个**采集单元，按品类跑 4 遍是把同一个 2MB 页面抓 4 次；
  #   品类由适配器从型号名推断，不用采集上下文。
  - code: acme_store
    country: MX
    name: Acme商城 MX
    kind: brand_store
    base_url: "https://consumer.acme.com/mx"
    search_url: "https://consumer.acme.com/mx/offer/"
    category_urls:
      phone: "https://consumer.acme.com/mx/offer/"
      tablet: "https://consumer.acme.com/mx/offer/"
      wearable: "https://consumer.acme.com/mx/offer/"
      audio: "https://consumer.acme.com/mx/offer/"
    adapter: acme_store
    default_seller_type: official
    priority: 5
  - code: meli
    country: MX
    name: MercadoLibre México
    kind: marketplace
    base_url: "https://www.mercadolibre.com.mx"
    search_url: "https://listado.mercadolibre.com.mx/{q}"
    adapter: meli
    default_seller_type: unknown
    priority: 5
    # ★ 2026-08-17 停用：robots.txt 用多组 User-agent 共用 Disallow: / 的写法
    #   点名封禁我们这类代理，且用户 2026-08-11 明示先不做 MercadoLibre。
    #   ★★ 必须在**这里**关而不是在库里关 —— db.seed() 的
    #   `ON CONFLICT ... DO UPDATE SET enabled=excluded.enabled`
    #   每次 init_db() 都会用本文件覆盖库里的 enabled，
    #   在库里（或界面上）关掉的渠道下次 init 就复活了。
    enabled: 0
  # ★ 品牌官方商城：站内搜索页抓不到东西，但品类页带完整 JSON-LD。
  #   2026-08-10 实测 samsung.com/mx 品类页有 10 个 JSON-LD Product
  #   （Z Fold8 45999 / Z Fold8 Ultra 50999 / Z Flip8 30499），搜索页 0 个。
  - code: samsung_store
    country: MX
    name: Samsung Shop México
    kind: brand_store
    base_url: "https://www.samsung.com/mx"
    search_url: "https://www.samsung.com/mx/search/?searchvalue={q}"
    category_urls:
      phone: "https://www.samsung.com/mx/smartphones/all-smartphones/"
      tablet: "https://www.samsung.com/mx/tablets/all-tablets/"
      wearable: "https://www.samsung.com/mx/watches/all-watches/"
      audio: "https://www.samsung.com/mx/audio-sound/all-audio-sound/"
      pc: "https://www.samsung.com/mx/computers/all-computers/"
    adapter: samsung
    default_seller_type: official
    priority: 50
  - code: apple_store
    country: MX
    name: Apple Store México
    kind: brand_store
    base_url: "https://www.apple.com/mx"
    search_url: "https://www.apple.com/mx/search/{q}"
    category_urls:
      phone: "https://www.apple.com/mx/shop/buy-iphone"
      tablet: "https://www.apple.com/mx/shop/buy-ipad"
      wearable: "https://www.apple.com/mx/shop/buy-watch"
      audio: "https://www.apple.com/mx/shop/buy-airpods"
      pc: "https://www.apple.com/mx/shop/buy-mac"
    adapter: apple
    default_seller_type: official
    priority: 50
    notes: "2026-08-10 实测：品类页 0 个 JSON-LD，可见文本有 23 个价格串，
      混着 24 期分期月供（$1,583.28）。专用适配器用「同一卡片内取最大价」
      + 分期上下文剔除来区分整机价与月供。"

  # ---------------- 哥伦比亚 ----------------
  - code: claro
    country: CO
    name: Claro Colombia
    kind: carrier
    base_url: "https://tienda.claro.com.co"
    # ★ 2026-08-11 实测：旧的 /catalogsearch/result/?q= 是 **Magento 路径，
    #   此站根本没有** —— 站点是 Next.js SPA，把它渲染成西语 404 页
    #   （正文 158 字符），而 <title> 是全站写死的静态标题。
    #   所以「标题正确 + 0 价格」看着像 JS 没渲染完，实际是走进死路径，
    #   连一次搜索请求都没发出去。真实搜索路由是 /results?searchTerm=。
    #   但 DOM 路线也不可用：卡片内没有 a[href]（"Ver producto" 是 JS 路由按钮），
    #   通用解析器 0 条；品类页只解出 4/24 且含标题/价格/URL 错配。
    #   ∴ 走站点自带的无鉴权 JSON 接口（裸 requests 即 200），见 ClaroCoAdapter。
    #   接口地址写在适配器里 —— channels.yaml 的加载器只认固定列，
    #   自定义键会被静默丢弃。
    search_url: "https://tienda.claro.com.co/results?searchTerm={q}"
    adapter: claro_co
    default_seller_type: official
    priority: 10
  - code: alkosto
    country: CO
    name: Alkosto
    kind: retailer
    base_url: "https://www.alkosto.com"
    # ★ 体检曾报 irrelevant「搜索没生效，必须修 search_url」—— **那是误判**。
    #   实测 search?text= 完全正常：110 个价格、88 处手机词、80 个商品链接。
    #   真正的问题是通用解析器只认出 4/80 条，而那 4 条恰好是边角推荐位，
    #   相关率 25% 触发了整批作废。已加低产率检测把这两种故障分开报。
    #   品类页比搜索页更全（132 价 / 91 链接），优先走它。
    # ★★ 2026-08-11 定案（两名工程师独立复现）：**别再解析 HTML 了**。
    #   站点是 Hybris，但商品网格是前端 Algolia InstantSearch 渲染的，
    #   服务端只预渲染 4 个商品 —— 这就是"只认出 4/80"的真正原因，
    #   不是选择器不好，是 HTML 里根本没有那 76 条。
    #   改走 Algolia 索引（页面 JS 里公开内嵌 search-only key）：
    #   手机品类 facet allcategories_string_mv:BI_101_ALKOS = 466 个商品。
    #   category_urls 保留：适配器从 URL 尾部的 /c/{码} 直接取 facet 值。
    search_url: "https://www.alkosto.com/search?text={q}"
    category_urls:
      phone: "https://www.alkosto.com/celulares/c/BI_101_ALKOS"
    adapter: alkosto
    default_seller_type: official
    priority: 20
  # ★★ Acme自家官方商城 —— 我方的官方定价基准。
