_source: 用户提供的 PowerQuery M 代码（SKU_Short），2026-08-10 导入
_semantics:
  normalize: lower → 去控制字符 → NBSP→空格 → 去重音 → ,→. → -→空格 → _→空格 → 压缩空白
  order: ★顺序敏感：取第一个匹配（M 的 List.First）。改行序 = 改结果
  keys: AND —— 所有 key 都要出现（Text.Contains）
  key_spaces: ★key 的前后空格有意义（'ipad 8 ' 防止匹配 ipad 80），不得 strip
  accessory_first: 配件判定优先于 SKU 匹配
  special_cases: acme m pen/m pencil 需不含 slate；book cover/keyboard 需不含 gb/ram/memoria（含则是整机捆绑）
  fallback: 含 tablet/tableta → Other Tablet；否则 Other
